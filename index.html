<body><div id="app"><main id="main"></main></div>
<nav class="tabs"><button data-act="tab" data-t="home"><b>⌂</b>Home</button><button data-act="tab" data-t="train"><b>♪</b>Train</button><button data-act="tab" data-t="songs"><b>♫</b>Songs</button><button data-act="tab" data-t="sets"><b>☰</b>Sets</button><button data-act="tab" data-t="progress"><b>↗</b>Progress</button></nav>

<script>
/* ===== CORE: pure music + scoring logic (unit-tested in Node) ===== */
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KEYS=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const KEY_PC={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const MAJ=[0,2,4,5,7,9,11];
const SOLFA={d:1,r:2,m:3,f:4,s:5,l:6,t:7};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const ftom=f=>69+12*Math.log2(f/440);
const mod12=n=>((n%12)+12)%12;
const midiName=m=>{m=Math.round(m);return NOTE_NAMES[mod12(m)]+(Math.floor(m/12)-1)};
const pcName=pc=>KEYS[mod12(pc)];
const foldCents=c=>(((c+600)%1200)+1200)%1200-600;
const centsOff=(midiSung,target)=>foldCents((midiSung-target)*100);
const tolFor=lv=>[55,45,35,30,25][Math.max(1,Math.min(5,Math.round(lv||1)))-1];
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}

/* --- pitch detection (YIN) --- */
function detectPitch(buf,sr){
  const N=buf.length,W=N>>1;let e=0;
  for(let i=0;i<N;i++)e+=buf[i]*buf[i];
  const rms=Math.sqrt(e/N);
  if(rms<0.008)return null;
  const maxTau=Math.min(W-1,Math.floor(sr/70)),minTau=Math.max(2,Math.floor(sr/1100));
  const d=new Float32Array(maxTau+2);
  for(let tau=1;tau<=maxTau;tau++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+tau];s+=x*x}d[tau]=s}
  let run=0;d[0]=1;
  for(let tau=1;tau<=maxTau;tau++){run+=d[tau];d[tau]=run?d[tau]*tau/run:1}
  let tau=-1;
  for(let t=minTau;t<=maxTau;t++){if(d[t]<0.15){while(t+1<=maxTau&&d[t+1]<d[t])t++;tau=t;break}}
  if(tau<0)return null;
  let x=tau;
  if(tau>1&&tau<maxTau){const a=d[tau-1],b=d[tau],c=d[tau+1],den=a-2*b+c;if(den)x=tau+0.5*(a-c)/den}
  return{freq:sr/x,clarity:1-d[tau],rms};
}

/* --- notation: numbers 1-7 or solfa d r m f s l t; 0=rest; , low octave; ' high octave; #/b accidental; :beats --- */
function parseNotation(str){
  const out=[];if(!str||!str.trim())return out;
  for(const tok of str.trim().split(/\s+/)){
    const m=/^([#b]?)([0-7]|[drmfslt])([,']*)(?::(\d+(?:\.\d+)?))?$/i.exec(tok);
    if(!m)throw new Error('Can’t read “'+tok+'”');
    const beats=m[4]?parseFloat(m[4]):1;
    if(!(beats>0))throw new Error('Beats must be above 0 in “'+tok+'”');
    const raw=m[2].toLowerCase();const deg=SOLFA[raw]||parseInt(raw,10);
    if(deg===0){out.push({semi:null,beats});continue}
    const oct=(m[3].match(/'/g)||[]).length-(m[3].match(/,/g)||[]).length;
    out.push({semi:MAJ[deg-1]+(m[1]==='#'?1:m[1]==='b'?-1:0)+12*oct,beats});
  }
  return out;
}

/* --- chords & harmony --- */
const CHORDS=[{n:'I',r:0,pcs:[0,4,7]},{n:'IV',r:5,pcs:[5,9,0]},{n:'V',r:7,pcs:[7,11,2]},{n:'vi',r:9,pcs:[9,0,4]},{n:'ii',r:2,pcs:[2,5,9]},{n:'iii',r:4,pcs:[4,7,11]}];
function chordsFor(v1,bpb,total){
  const out=[];let prev=CHORDS[0];
  for(let b=0;b*bpb<total-1e-9;b++){
    const s0=b*bpb,e0=s0+bpb;let best=null,bw=0;
    CHORDS.forEach((c,ci)=>{
      let w=0;
      v1.forEach(ev=>{if(ev.semi==null)return;
        const ov=Math.max(0,Math.min(e0,ev.s+ev.d)-Math.max(s0,ev.s));if(!ov)return;
        const pc=mod12(ev.semi);let k=c.pcs.indexOf(pc);if(k<0)return;
        w+=ov*(k===0?1.15:1)*(Math.abs(ev.s-s0)<1e-9?1.4:1)});
      w-=ci*0.001;if(w>bw){bw=w;best=c}});
    if(!best)best=prev;prev=best;out.push({s:s0,d:bpb,chord:best});
  }
  return out;
}
function chordAt(chords,beat,bpb){return chords[Math.max(0,Math.min(chords.length-1,Math.floor(beat/bpb+1e-9)))].chord}
function chordToneBelow(semi,pcs){for(let d=1;d<=12;d++){const x=semi-d;if(pcs.includes(mod12(x)))return x}return semi-12}
function buildSong(song){
  const bpb=song.meter||4;let off=0;const lines=[],v1=[],v2=[],v3=[],c2=[],c3=[],has2=[],has3=[];
  const pushEvs=(arr,str,start,li)=>{let t=start;parseNotation(str).forEach(e=>{arr.push({s:t,d:e.beats,semi:e.semi,line:li});t+=e.beats})};
  song.lines.forEach((ln,i)=>{
    const evs=parseNotation(ln.v1);const len=evs.reduce((a,e)=>a+e.beats,0);
    pushEvs(v1,ln.v1,off,i);
    const a=ln.v2&&ln.v2.trim(),b=ln.v3&&ln.v3.trim();
    has2[i]=!!a;has3[i]=!!b;
    if(a)pushEvs(c2,ln.v2,off,i);if(b)pushEvs(c3,ln.v3,off,i);
    lines.push({start:off,len,lyric:ln.lyric||''});off+=len;
  });
  const total=off,chords=chordsFor(v1,bpb,total);
  v1.forEach(ev=>{
    if(ev.semi==null){v2.push({...ev});v3.push({...ev});return}
    const pcs=chordAt(chords,ev.s,bpb).pcs;
    const a=chordToneBelow(ev.semi,pcs),b=chordToneBelow(a,pcs);
    if(!has2[ev.line])v2.push({...ev,semi:a});
    if(!has3[ev.line])v3.push({...ev,semi:b});
  });
  c2.forEach(e=>v2.push(e));c3.forEach(e=>v3.push(e));
  v2.sort((x,y)=>x.s-y.s);v3.sort((x,y)=>x.s-y.s);
  const nr=v1.filter(e=>e.semi!=null);
  return{bpb,lines,total,chords,parts:{v1,v2,v3},firstSemi:nr.length?nr[0].semi:0,lastSemi:nr.length?nr[nr.length-1].semi:0};
}
function keyBase(key,transpose){return 60+mod12((KEY_PC[key]||0)+(transpose||0))}
function fitShift(midis,range){
  if(!midis.length||!range||range.lo==null)return 0;
  const c=(range.lo+range.hi)/2;return 12*Math.round((c-median(midis))/12);
}
function songTimeline(model,o){
  const base=keyBase(o.key,o.transpose),beatSec=60/(o.bpm*(o.tempoMul||1));
  const a=o.lineFrom||0,b=o.lineTo==null?model.lines.length-1:o.lineTo;
  const startBeat=model.lines[a].start,endBeat=model.lines[b].start+model.lines[b].len;
  const singMidis=model.parts[o.sing].filter(e=>e.semi!=null).map(e=>base+e.semi);
  const shift=fitShift(singMidis,o.range||{})+12*(o.oct||0);
  const events=[];
  ['v1','v2','v3'].forEach(v=>model.parts[v].forEach(e=>{
    if(e.semi==null||e.s<startBeat-1e-9||e.s>=endBeat-1e-9)return;
    events.push({t:(e.s-startBeat)*beatSec,d:e.d*beatSec,midi:base+e.semi+shift,voice:v,line:e.line,
      scored:v===o.sing,audible:!!(o.hear&&o.hear[v])});
  }));
  events.sort((x,y)=>x.t-y.t);
  const chords=[];
  model.chords.forEach(c=>{
    if(c.s<startBeat-1e-9||c.s>=endBeat-1e-9)return;
    chords.push({t:(c.s-startBeat)*beatSec,d:c.d*beatSec,tones:chordVoicing(c.chord,base+shift)});
  });
  const clicks=[];
  for(let k=0;startBeat+k<endBeat-1e-9;k++)clicks.push({t:k*beatSec,strong:(startBeat+k)%model.bpb===0});
  const lineMarks=[];
  for(let i=a;i<=b;i++)lineMarks.push({idx:i,t:(model.lines[i].start-startBeat)*beatSec,end:(model.lines[i].start+model.lines[i].len-startBeat)*beatSec,lyric:model.lines[i].lyric});
  return{events,chords,clicks,lineMarks,dur:(endBeat-startBeat)*beatSec,beatSec,shift,base,bpb:model.bpb};
}
function chordVoicing(chord,baseMidi){
  const pcs=chord.pcs.map((p,i)=>i&&p<chord.pcs[0]?p+12:p);
  let tones=pcs.map(p=>baseMidi+p-12);
  while(Math.max(...tones)>64)tones=tones.map(t=>t-12);
  while(Math.min(...tones)<45)tones=tones.map(t=>t+12);
  let bass=baseMidi+chord.r-24;while(bass>52)bass-=12;while(bass<36)bass+=12;
  return{tones,bass};
}

/* --- analysis --- */
function analyzePart(events,range){
  const nr=events.filter(e=>e.semi!=null&&e.midi!=null);
  const out=[],leaps=[];
  nr.forEach((e,i)=>{
    if(range&&range.lo!=null&&(e.midi<range.lo-0.5||e.midi>range.hi+0.5))out.push({line:e.line,midi:e.midi});
    if(i&&Math.abs(e.midi-nr[i-1].midi)>=7&&e.line===nr[i-1].line)leaps.push({line:e.line,from:nr[i-1].midi,to:e.midi});
  });
  const ms=nr.map(e=>e.midi);
  return{outOfRange:out,leaps,lowest:ms.length?Math.min(...ms):null,highest:ms.length?Math.max(...ms):null,span:ms.length?Math.max(...ms)-Math.min(...ms):0};
}
function suggestShift(model,key,partName,range){
  if(!range||range.lo==null)return 0;
  const semis=model.parts[partName].filter(e=>e.semi!=null).map(e=>e.semi);
  let best=0,bc=1e9;
  for(let t=-6;t<=5;t++){
    const base=keyBase(key,t);
    for(let k=-3;k<=3;k++){
      const c=semis.filter(s=>{const m=base+s+12*k;return m<range.lo-0.5||m>range.hi+0.5}).length;
      const score=c*100+Math.abs(t);
      if(score<bc){bc=score;best=t}
    }
  }
  return best;
}
function songDifficulty(model,key,transpose,partName,range){
  const base=keyBase(key,transpose);
  const evs=model.parts[partName].map(e=>({...e,midi:e.semi==null?null:base+e.semi}));
  const ms=evs.filter(e=>e.midi!=null).map(e=>e.midi);
  const shift=fitShift(ms,range||{});
  const fitted=evs.map(e=>e.midi==null?e:{...e,midi:e.midi+shift});
  const an=analyzePart(fitted,range);
  const score=an.outOfRange.length*3+an.leaps.length*2+(an.span>12?3:0);
  return{...an,score,level:score<=2?'Easy':score<=8?'Moderate':'Challenging'};
}

/* --- transitions --- */
const REL={0:['Same key','easy'],1:['Half step up','medium'],2:['Whole step up — a classic lift','easy'],3:['Minor third up','medium'],4:['Major third up','medium'],5:['Up a fourth — closely related','easy'],6:['Tritone away — distant keys','tricky'],7:['Up a fifth — closely related','easy'],8:['Down a major third','medium'],9:['Down a minor third','medium'],10:['Down a whole step','easy'],11:['Down a half step','medium']};
function transitionAdvice(a,b){
  const d=mod12(b.pc-a.pc),rel=REL[d],bpmDiff=b.bpm-a.bpm;
  const tempo=Math.abs(bpmDiff)<=8?'Tempos are close — keep the groove going and flow straight in.'
    :bpmDiff>0?'Next song is faster — build energy through the last chorus, then count in at the new tempo.'
    :'Next song is slower — ease the last line, hold the final note and let the band settle before the new count-in.';
  const gap=Math.min(mod12(a.endPc-b.startPc),mod12(b.startPc-a.endPc));
  const V=pcName(b.pc+7);
  let method,cue;
  if(gap===0){method='Sustain the closing note ('+pcName(a.endPc)+') — it is also the opening note of the next song, so voices can slide straight in.';cue='Hold '+pcName(a.endPc)+' → enter';}
  else if(gap<=2){method='The closing note ('+pcName(a.endPc)+') sits a step from the next opening note ('+pcName(b.startPc)+'). Hold it, then step across.';cue='Hold '+pcName(a.endPc)+' → step to '+pcName(b.startPc);}
  else{method='Use a short instrumental bridge on the '+V+' chord (1–2 bars) to reset the ear before the new entry on '+pcName(b.startPc)+'.';cue='Bridge on '+V+' chord → enter on '+pcName(b.startPc);}
  let level=rel[1];
  if(Math.abs(bpmDiff)>25&&level==='easy')level='medium';
  if(gap>2&&level==='medium'&&d!==0)level='medium';
  return{keyNote:rel[0],tempoNote:tempo,method,cue,level,keyDistance:d,bridgeChord:V};
}
const THEMES=['Thanksgiving','Adoration','Surrender','Intimacy','Reverence'];
function suggestOrder(items,theme){
  const t=(theme||'').toLowerCase();
  const match=s=>(s.theme||'').toLowerCase()===t?1:0;
  const calm=['surrender','intimacy','reverence'].includes(t);
  return [...items].sort((a,b)=>{
    if(calm&&match(a)!==match(b))return match(a)-match(b);
    return b.bpm-a.bpm;
  });
}

/* --- scoring --- */
const FPS=25;
function scoreEvents(events,frames,tol){
  const res=[];
  events.filter(e=>e.scored).forEach(e=>{
    const t0=e.t+Math.min(0.3,e.d*0.25),t1=e.t+e.d;
    const inWin=frames.filter(f=>f.t>=t0&&f.t<t1);
    const voiced=inWin.filter(f=>f.midi!=null);
    const expected=Math.max(1,Math.floor((t1-t0)*FPS*0.8));
    if(voiced.length<Math.max(2,expected*0.3)){res.push({ev:e,missed:true});return}
    const cents=voiced.map(f=>centsOff(f.midi,e.midi));
    const ok=cents.filter(c=>Math.abs(c)<=tol).length/cents.length;
    const m=median(cents),sd=Math.sqrt(mean(cents.map(c=>(c-mean(cents))**2)));
    res.push({ev:e,missed:false,inTune:ok,medianCents:m,wobble:sd});
  });
  return res;
}
function summarize(res){
  const att=res.filter(r=>!r.missed);
  const accuracy=att.length?Math.round(100*mean(att.map(r=>r.inTune))):0;
  const coverage=res.length?att.length/res.length:0;
  const tendency=att.length?median(att.map(r=>r.medianCents)):0;
  const wobble=att.length?mean(att.map(r=>r.wobble)):0;
  const weak=[...att].filter(r=>r.inTune<0.6).sort((a,b)=>a.inTune-b.inTune).slice(0,3);
  const byLine={};att.forEach(r=>{const l=r.ev.line;if(l==null)return;(byLine[l]=byLine[l]||[]).push(r.inTune)});
  const lineAcc=Object.keys(byLine).map(k=>({line:+k,acc:Math.round(100*mean(byLine[k]))}));
  return{accuracy,coverage,tendency,wobble,weak,lineAcc,total:res.length,attempted:att.length};
}
function coachFeedback(s,ctx){
  ctx=ctx||{};const out=[];
  if(!s.total){return['Nothing to score in this run — press Start and sing along when you’re ready.']}
  if(s.coverage<0.5)out.push('I could only hear you on about '+Math.round(s.coverage*100)+'% of the notes. Try singing a little closer to the mic, and it is fine to hum first — a gentle “mm” is a great start.');
  if(s.attempted){
    if(s.accuracy>=85)out.push('Lovely — your pitch was steady and secure. Next step: try it in a new key or at a faster tempo.');
    else if(s.accuracy>=70)out.push('Good work — most notes landed well. A couple of spots need another pass; loop them once or twice.');
    else if(s.accuracy>=50)out.push('You are getting there — many notes were close. Slow the tempo, keep the guide tone on, and listen before each entry.');
    else out.push('This one is tricky, and that is completely normal. Loop just the first phrase, slow it down, and keep the guide tone on until it feels familiar.');
    if(s.tendency>20)out.push('You leaned a little sharp (about '+Math.round(s.tendency)+' cents). Relax the jaw and tongue, and think “open and down” rather than pushing up to the note.');
    else if(s.tendency<-20)out.push('You leaned a little flat (about '+Math.round(-s.tendency)+' cents). Keep the breath flowing and imagine the note slightly above where it feels comfortable.');
    else if(s.attempted>2)out.push('Your pitch centre is nicely balanced — not leaning flat or sharp.');
    if(s.weak.length)out.push('Notes to revisit: '+s.weak.map(r=>midiName(r.ev.midi)).filter((v,i,a)=>a.indexOf(v)===i).join(', ')+'.');
    if(ctx.edge)out.push('Some of those notes sit at the edge of your comfortable range. Never force them — try a nearby key that sits more comfortably.');
  }
  return out;
}
function nextLevel(level,accs){

  if(last.length>=2&&last.every(a=>a<45))return Math.max(1,level-1);
  return level;
}
function voiceHint(lo,hi){

}

/* --- microphone + live pitch --- */
const Mic={stream:null,an:null,buf:null,timer:0,subs:new Set(),hist:[],last:null,src:null,

    if(this.stream)return true;const c=ac();
    try{this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:!S.settings.headphones,noiseSuppression:false,autoGainControl:false}})}catch(e){this.stream=null;return false}
    this.src=c.createMediaStreamSource(this.stream);this.an=c.createAnalyser();this.an.fftSize=2048;this.src.connect(this.an);
    this.buf=new Float32Array(2048);this.hist=[];this.timer=setInterval(()=>this.tick(),1000/FPS);return true;
  },
  tick(){
    if(!this.an)return;this.an.getFloatTimeDomainData(this.buf);
    const r=detectPitch(this.buf,AC.sampleRate);let midi=null;
    if(r&&r.clarity>0.85){

      this.hist.push(raw);if(this.hist.length>5)this.hist.shift();midi=median(this.hist);
    }else{this.hist.shift()}

  },
  stop(){clearInterval(this.timer);this.subs.clear();if(this.stream)this.stream.getTracks().forEach(t=>t.stop());try{this.src&&this.src.disconnect()}catch(e){}this.stream=null;this.an=null;this.last=null}

/* --- runner: schedules guide audio, listens, scores --- */
const LAT=0.09;

function pitchRange(spec){

function targetAt(spec,now){return spec.events.find(e=>e.scored&&now>=e.t-0.25&&now<=e.t+e.d+0.1)}
async function startRun(spec){
  const ok=await Mic.start();

  stopRun(true);LASTRES=null;
  const c=ac(),gain=c.createGain();gain.gain.value=1;gain.connect(c.destination);
  RUN={spec,gain,frames:[],allRes:[],passes:0,t0:0,stopping:false,rec:null,chunks:[],started:Date.now(),pr:pitchRange(spec)};
  if(spec.record&&window.MediaRecorder){
    try{RUN.rec=new MediaRecorder(Mic.stream);RUN.rec.ondataavailable=e=>{if(e.data&&e.data.size)RUN.chunks.push(e.data)};RUN.rec.start()}catch(e){RUN.rec=null}
  }
  RUN.sub=f=>{
    if(!RUN||RUN.t0===0)return;const now=f.t-RUN.t0-LAT;
    const fr={t:now,midi:f.midi,disp:null,cents:null};
    if(f.midi!=null){
      const tg=targetAt(RUN.spec,now);
      if(tg){const cc=centsOff(f.midi,tg.midi);fr.cents=cc;fr.disp=tg.midi+Math.max(-6,Math.min(6,cc/100))}
      else{const ctr=(RUN.pr.lo+RUN.pr.hi)/2;fr.disp=f.midi+12*Math.round((ctr-f.midi)/12)}

  };

}
function beginPass(){
  const c=ac(),r=RUN,spec=r.spec,bs=spec.beatSec||0.6;

  r.t0=c.currentTime+0.25+n*bs;r.frames=[];r.passes++;r.n=n;
  for(let i=0;i<n;i++)playClick(c,r.gain,r.t0-(n-i)*bs,i===0);
  spec.events.forEach(e=>{if(e.audible)playTone(c,r.gain,r.t0+e.t,e.d,mtof(e.midi),e.gain||(e.voice==='v1'||e.voice==='guide'?0.22:0.15),'triangle')});
  (spec.chords||[]).forEach(ch=>{
    ch.tones.tones.forEach(m=>playTone(c,r.gain,r.t0+ch.t,ch.d,mtof(m),ch.vol||0.05,'sine'));
    playTone(c,r.gain,r.t0+ch.t,ch.d,mtof(ch.tones.bass),ch.vol?ch.vol*1.8:0.1,'triangle');
  });

function loop(){

function stopRun(silent){

function teardownRun(){
  if(!RUN)return;const r=RUN;cancelAnimationFrame(r.raf);try{r.gain.disconnect()}catch(e){}

async function finishRun(){

}

/* --- piano-roll drawing --- */
function fitCanvas(cv){const d=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}return d}
let VIEWSPEC=null;
const VCOL={v1:'#f2b84b',v2:'#5b9bff',v3:'#a78bfa',guide:'#5b9bff',you:'#f2b84b'};
function drawRoll(now){
  const cv=$('#roll');if(!cv)return;const spec=RUN?RUN.spec:VIEWSPEC;if(!spec)return;
  const d=fitCanvas(cv),ctx=cv.getContext('2d'),W=cv.clientWidth,H=cv.clientHeight;
  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);

  const px0=W*0.22,pps=W*0.78/6,x=t=>px0+(t-now)*pps;
  ctx.font='10px system-ui';ctx.textBaseline='middle';
  for(let m=pr.lo;m<=pr.hi;m++){
    const pc=mod12(m),nat=[0,2,4,5,7,9,11].includes(pc);
    if(nat){ctx.strokeStyle=pc===0?'rgba(147,160,184,.35)':'rgba(147,160,184,.13)';ctx.beginPath();ctx.moveTo(0,y(m));ctx.lineTo(W,y(m));ctx.stroke();if(pc===0||pc===7||pc===4){ctx.fillStyle='rgba(147,160,184,.7)';ctx.fillText(midiName(m),4,y(m)-6)}}
  }
  const bh=Math.max(5,ph*0.78);
  spec.events.forEach(e=>{
    const x0=x(e.t),x1=x(e.t+e.d);if(x1<0||x0>W)return;
    const past=e.t+e.d<now;ctx.globalAlpha=e.scored?(past?.45:.95):(e.audible?(past?.25:.5):.0);
    if(!e.scored&&!e.audible){ctx.globalAlpha=past?.1:.22}
    ctx.fillStyle=VCOL[e.voice]||'#f2b84b';
    const rw=Math.max(3,x1-x0-2),rx=Math.max(x0,-50);
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x0,y(e.midi)-bh/2,rw,bh,bh/2);else ctx.rect(x0,y(e.midi)-bh/2,rw,bh);ctx.fill();
  });
  ctx.globalAlpha=1;
  if(RUN){
    const tol=spec.tol;
    RUN.frames.forEach(f=>{
      if(f.disp==null||f.t<now-6.5||f.t>now+0.1)return;
      const a=Math.abs(f.cents==null?0:f.cents);
      ctx.fillStyle=f.cents==null?'#9fb4d9':a<=tol?'#34c38f':a<=tol*1.8?'#f5b73d':'#f0795a';
      ctx.beginPath();ctx.arc(x(f.t),y(f.disp),Math.max(2.4,ph*0.26),0,7);ctx.fill();
    });
  }

}
function bannerAt(spec,now){
  const bs=spec.beatSec||0.6;
  if(now<0&&RUN&&RUN.n)return 'Get ready … '+Math.max(1,Math.ceil(-now/bs));
  if(spec.cues&&spec.cues.length){let t='';spec.cues.forEach(c=>{if(c.t<=now)t=c.text});return t}
  const sc=spec.events.filter(e=>e.scored),cur=sc.find(e=>now>=e.t&&now<e.t+e.d);
  if(cur)return(cur.d>=2*bs?'Sustain · ':'Sing · ')+midiName(cur.midi);

}
function updateNow(now){
  const spec=RUN.spec,b=$('#bn');if(b)b.textContent=bannerAt(spec,now);
  const ly=$('#ly');if(ly&&spec.lineMarks){const m=spec.lineMarks.find(l=>now>=l.t-0.05&&now<l.end);ly.textContent=m?m.lyric:''}
  const f=Mic.last,nn=$('#nn'),nd=$('#nd'),nc=$('#nc');if(!nn)return;
  if(f&&f.midi!=null&&AC.currentTime-f.t<0.3){
    const tg=targetAt(spec,now),c=tg?centsOff(f.midi,tg.midi):(f.midi-Math.round(f.midi))*100,cl=Math.max(-50,Math.min(50,c));
    nn.textContent=midiName(f.midi);nd.style.left=(50+cl)+'%';
    const a=Math.abs(c);nd.style.background=a<=spec.tol?'#34c38f':a<=spec.tol*1.8?'#f5b73d':'#f0795a';
    nc.textContent=a<=spec.tol?'in tune':(c<0?'a bit flat':'a bit sharp');
  }else{nn.textContent='–';nd.style.left='50%';nd.style.background='#93a0b8';nc.textContent='listening'}

/* --- exercises --- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const INTN={2:'major 2nd',3:'minor 3rd',4:'major 3rd',5:'perfect 4th',7:'perfect 5th',8:'minor 6th',9:'major 6th',10:'minor 7th',11:'major 7th'};
const ROLE={4:'third',7:'fifth',9:'sixth',12:'octave'};
const EXS=[
 {id:'warmup',name:'Gentle Warm-up',icon:'☀',focus:'Warm-up',why:'Five-note scales that wake up the voice gently and settle your pitch for the day.'},
 {id:'sustain',name:'Steady Notes',icon:'〰',focus:'Steadiness',why:'Hold one note without wobbling. This builds breath control and pitch stability — vital for long worship notes.'},
 {id:'echo',name:'Echo Notes',icon:'♫',focus:'Ear training',why:'Listen, then sing it back. This trains your ear to find a note before you sing it.'},
 {id:'arp',name:'Arpeggios',icon:'↗',focus:'Leaps',why:'Jump 1–3–5 and back. Builds accuracy on leaps, which is where most pitch slips happen.'},
 {id:'intervals',name:'Interval Training',icon:'↔',focus:'Intervals',why:'Hear the gap between two notes and sing it. The foundation for learning harmony parts.'},
 {id:'harmony',name:'Harmony Hold',icon:'☰',focus:'Harmony',why:'A chord plays and you hold a different note against it — exactly the skill of singing Voice 2 or 3 without sliding to the melody.'}
];
function buildExercise(id){
  const L=myLevel(id),{lo,hi}=rangeOf(),c=Math.round((lo+hi)/2),R=rng(Date.now()&0xffffff),ev=[],cues=[],chs=[];let t=0;
  const add=(k,d,m,g)=>{ev.push(k==='L'?{t,d,midi:m,voice:'guide',scored:false,audible:true,gain:g}:{t,d,midi:m,voice:'you',scored:true,audible:false});t+=d};
  const cue=x=>cues.push({t,text:x});
  const pattern=(pat)=>{
    const nd=Math.max(0.45,0.85-0.08*L),mx=Math.max(...pat);let roots=[];
    for(let r=lo+1;r+mx<=hi&&roots.length<3+L;r+=2)roots.push(r);if(!roots.length)roots=[lo];
    roots.forEach(r=>{
      if(L<=2){cue('Listen …');pat.forEach(p=>add('L',nd,r+p));t+=0.4}else{cue('Your starting note');add('L',0.9,r);t+=0.3}
      cue('Your turn — sing it');pat.forEach(p=>add('S',nd,r+p));t+=0.9;
    });
  };
  const ex=EXS.find(e=>e.id===id);
  if(id==='warmup')pattern([0,2,4,5,7,5,4,2,0]);
  else if(id==='arp')pattern(hi-lo>=15&&L>=4?[0,4,7,12,7,4,0]:[0,4,7,4,0]);
  else if(id==='sustain'){
    const hold=4+L;[0.35,0.55,0.75].map(f=>Math.round(lo+(hi-lo)*f)).forEach(m=>{cue('Listen …');add('L',1.5,m);t+=0.5;cue('Sing it and hold it steady');add('S',hold,m);t+=1.2});
  }else if(id==='echo'){
    const k=[1,1,2,3,4][L-1],n=5+L;
    for(let i=0;i<n;i++){
      let m=lo+1+Math.floor(R()*Math.max(1,hi-lo-1));const ph=[m];
      for(let j=1;j<k;j++){m=Math.max(lo,Math.min(hi,m+[-4,-2,-1,2,4][Math.floor(R()*5)]));ph.push(m)}
      cue('Listen …');ph.forEach(x=>add('L',0.75,x));t+=0.4;cue('Echo it back');ph.forEach(x=>add('S',L<=2?1.2:0.9,x));t+=0.9;
    }
  }else if(id==='intervals'){
    const sets=[[4,7],[4,7,5],[4,7,5,2,9],[4,7,5,2,9,3,8],[4,7,5,2,9,3,8,11,10]][L-1],span=hi-lo;
    let use=sets.filter(i=>i<=span);if(!use.length)use=[2];
    for(let i=0;i<5+L;i++){
      const it=use[Math.floor(R()*use.length)],r=lo+Math.floor(R()*(span-it+1));
      cue('Listen: the lower note');add('L',1,r);t+=0.2;cue('Sing the lower note');add('S',1.1,r);t+=0.3;
      cue('Listen: a '+INTN[it]+' higher');add('L',1,r+it);t+=0.2;cue('Now sing the higher note');add('S',1.2,r+it);t+=0.9;
    }
  }else if(id==='harmony'){
    const offs=L===1?[4]:L===2?[4,7]:[4,7,9,12];
    for(let i=0;i<2+L;i++){
      const off=offs[i%offs.length],target=Math.max(lo+1,Math.min(hi-1,c+Math.round(R()*4-2)));
      let rt=target-off;while(rt>57)rt-=12;while(rt<45)rt+=12;
      cue('Listen to your note …');add('L',1.4,target);t+=0.4;
      const hold=5+L;cue('The chord plays — hold the '+ROLE[off]);chs.push({t,d:hold,tones:{tones:[rt,rt+7],bass:rt-12},vol:0.07});add('S',hold,target);t+=1;
    }
  }
  return{title:ex.name,kind:'exercise',ref:id,events:ev,cues,chords:chs,clicks:[],lineMarks:null,dur:t,beatSec:0.6,countIn:0,tol:tolFor(L),level:L};
}

/* --- song practice + set run specs --- */
let P=null;
function initP(id,o){
  o=o||{};const s=songById(id),m=getModel(s);
  P={id,transpose:o.transpose||0,tempo:1,oct:0,sing:o.sing||S.profile.part||'v1',hear:{v1:false,v2:false,v3:false},accomp:true,click:false,loop:!!o.loop,from:o.from||0,to:o.to==null?m.lines.length-1:o.to,record:false};
  P.hear[P.sing]=true;
}
function practiceSpec(){
  const s=songById(P.id),m=getModel(s);
  const tl=songTimeline(m,{key:s.key,transpose:P.transpose,bpm:s.bpm,tempoMul:P.tempo,sing:P.sing,hear:P.hear,range:rangeOf(),oct:P.oct,lineFrom:P.from,lineTo:P.to});
  return{title:s.title,kind:'song',ref:s.id,events:tl.events,chords:P.accomp?tl.chords:[],clicks:P.click?tl.clicks:[],lineMarks:tl.lineMarks,dur:tl.dur,beatSec:tl.beatSec,countIn:m.bpb,tol:tolFor(S.profile.level),loop:P.loop,record:P.record,level:S.profile.level};
}
function itemInfo(it){
  const s=songById(it.song);if(!s)return null;const m=getModel(s),base=keyBase(s.key,it.transpose||0);
  return{s,m,base,pc:mod12(base),keyName:keyName(s.key,it.transpose||0),bpm:s.bpm,startPc:mod12(base+m.firstSemi),endPc:mod12(base+m.lastSemi),sing:it.sing||S.profile.part||'v1'};
}
function setItems(set){return set.items.map(it=>({it,i:itemInfo(it)})).filter(x=>x.i)}
function adviceFor(a,b){return transitionAdvice({pc:a.pc,bpm:a.bpm,endPc:a.endPc},{pc:b.pc,bpm:b.bpm,startPc:b.startPc})}
function setRunSpec(set,from,to){
  const items=setItems(set).slice(from,to+1),events=[],chords=[],cues=[],lineMarks=[];let off=0,first=null;
  items.forEach(({it,i},k)=>{
    const tl=songTimeline(i.m,{key:i.s.key,transpose:it.transpose||0,bpm:i.bpm,tempoMul:1,sing:i.sing,hear:{[i.sing]:true},range:rangeOf()});
    if(!first)first=tl;
    tl.events.forEach(e=>events.push({...e,t:e.t+off}));
    tl.chords.forEach(c=>chords.push({...c,t:c.t+off}));
    tl.lineMarks.forEach(l=>lineMarks.push({...l,t:l.t+off,end:l.end+off}));
    cues.push({t:off,text:'▶ '+i.s.title+' · '+i.keyName+' · '+i.bpm+' bpm'});
    const nx=items[k+1];
    if(nx){
      const adv=adviceFor(i,nx.i),nb=60/nx.i.bpm,gap=4*nb;
      cues.push({t:off+Math.max(0,tl.dur-2*tl.beatSec*i.m.bpb),text:'Coming up: '+nx.i.s.title+' — '+adv.cue});
      cues.push({t:off+tl.dur,text:'Transition — '+adv.cue});
      chords.push({t:off+tl.dur,d:gap,tones:chordVoicing(CHORDS[2],keyBase(nx.i.s.key,nx.it.transpose||0)),vol:0.05});
      off+=tl.dur+gap;
    }else off+=tl.dur;
  });
  return{title:set.name||'Worship set',kind:'set',ref:set.id,events,chords,clicks:[],cues,lineMarks,dur:off,beatSec:first?first.beatSec:0.6,countIn:first?first.bpb:4,tol:tolFor(S.profile.level),level:S.profile.level};
}
function servicePlan(set){
  const items=setItems(set),steps=[],r=rangeOf();
  steps.push({text:'Warm up your voice (3 minutes)',act:'exercise',id:'warmup'});
  const ranked=items.map((x,idx)=>{const d=songDifficulty(x.i.m,x.i.s.key,x.it.transpose||0,x.i.sing,r);return{...x,idx,d}}).sort((a,b)=>b.d.score-a.d.score);
  ranked.forEach(({it,i,d,idx})=>{
    const bits=[];
    if(d.outOfRange.length){const nm=[...new Set(d.outOfRange.map(o=>midiName(o.midi)))].slice(0,4).join(', ');bits.push('notes at the edge of your range ('+nm+') — never force them; try another key');}
    if(d.leaps.length)bits.push('big leaps in line'+(d.leaps.length>1?'s ':' ')+[...new Set(d.leaps.map(l=>l.line+1))].join(', '));
    if(it.transpose)bits.push('sung in '+i.keyName+' (original '+i.s.key+') — practise it in the new key');
    const hot=d.outOfRange[0]?d.outOfRange[0].line:d.leaps[0]?d.leaps[0].line:null;
    steps.push({text:i.s.title+' — '+PARTN[i.sing]+' in '+i.keyName+': '+(bits.length?bits.join('; '):'learn it line by line, then sing it through'),act:'song',id:i.s.id,transpose:it.transpose||0,sing:i.sing,from:hot,to:hot,loop:hot!=null,idx});
  });
  for(let k=0;k<items.length-1;k++){const adv=adviceFor(items[k].i,items[k+1].i);steps.push({text:'Transition: '+items[k].i.s.title+' → '+items[k+1].i.s.title+' — '+adv.cue,act:'setrun',id:set.id,from:k,to:k+1})}
  if(items.length>1)steps.push({text:'Full run-through of the whole set',act:'setrun',id:set.id,from:0,to:items.length-1});
  else if(items.length===1)steps.push({text:'Sing the song through once from start to finish',act:'song',id:items[0].i.s.id,transpose:items[0].it.transpose||0,sing:items[0].i.sing});
  const days=daysUntil(set.date);
  steps.forEach((s,i)=>{s.day=days>0?Math.min(days,Math.floor(i*Math.min(days,steps.length)/steps.length)+1):1});
  return{steps,days};
}

const VIEWS={},AFTER={},A={},IN={},CHG={};
let V={name:'home',p:{}},STACK=[],PLAN=[],ED=null,AS={step:0},SQ={q:'',lang:'all'},PR={a:null,b:null};
const TABOF={home:'home',settings:'home',train:'train',exercise:'train',assess:'train',songs:'songs',song:'songs',editor:'songs',practice:'songs',sets:'sets',set:'sets',setrun:'sets',progress:'progress'};
function go(name,p,replace){stopRun(true);Mic.stop();if(!replace)STACK.push(V);V={name,p:p||{}};LASTRES=null;VIEWSPEC=null;render();window.scrollTo(0,0)}
function render(keep){
  const y=window.scrollY;$('#main').innerHTML=VIEWS[V.name](V.p);

const hdr=(t,back)=>`<div class="hdr">${back===false?'':'<button class="back" data-act="back">‹ Back</button>'}</div><h1>${t}</h1>`;
const rollBlock=()=>`<canvas id="roll" class="roll"></canvas><div class="banner" id="bn">Ready when you are</div><div class="lyric" id="ly"></div><div class="now"><div class="nn" id="nn">–</div><div class="meter"><i id="nd"></i></div><div class="nc" id="nc">listening</div></div>`;
const runBtn=l=>`<button class="btn pri big" id="runbtn" data-act="start">${l||'Start'}</button>`;
function runUI(on){const b=$('#runbtn');if(!b)return;b.textContent=on?'Stop':'Start';b.dataset.act=on?'stop':'start';const c=$('#ctl');if(c){c.style.opacity=on?.45:1;c.style.pointerEvents=on?'none':'auto'}}
function resultCard(){
  if(!LASTRES)return'';const r=LASTRES.sum;
  return`<div class="card fb"><div class="row sp"><h3>How that went</h3>${r.attempted?`<span class="badge ${r.accuracy>=70?'ok':r.accuracy>=50?'wn':'or'}">${r.accuracy}% in tune</span>`:''}</div>
  ${r.attempted?`<div class="bar mt"><i style="width:${r.accuracy}%"></i></div><p class="mu sm">Heard on ${Math.round(r.coverage*100)}% of notes · ${r.attempted} of ${r.total} notes scored</p>`:''}
  ${LASTRES.fb.map(f=>`<p>${esc(f)}</p>`).join('')}</div>`;
}
const levelBadge=id=>`<span class="badge">Level ${myLevel(id)}</span>`;

/* --- HOME --- */
function weakestEx(){
  const ids=['sustain','echo','arp','intervals','harmony'];
  const st=ids.map(id=>{const a=S.sessions.filter(s=>s.ref===id).slice(-3).map(s=>s.acc);return{id,n:a.length,avg:a.length?mean(a):0}});
  return(st.find(s=>s.n===0)||st.sort((a,b)=>a.avg-b.avg)[0]).id;
}
function todayPlan(){
  const p=[{act:'exercise',id:'warmup',why:'Warm up gently — 3 minutes'}];
  const w=weakestEx(),we=EXS.find(e=>e.id===w);p.push({act:'exercise',id:w,why:'Focus today: '+we.focus.toLowerCase()});
  const ns=nextSet();let done=false;
  if(ns){const sp=servicePlan(ns).steps.find(s=>s.act==='song');if(sp){p.push({...sp,why:'For '+ns.name+(ns.date?' ('+fmtDate(ns.date)+')':'')});done=true}}
  if(!done){const last=[...S.sessions].reverse().find(s=>s.type==='song'&&songById(s.ref));const s=last?songById(last.ref):BUILTIN[0];p.push({act:'song',id:s.id,why:last?'Keep going with your song':'Try a worship song'})}
  return p;
}
function planTitle(st){return st.act==='exercise'?EXS.find(e=>e.id===st.id).name:st.act==='song'?(songById(st.id)||{}).title:'Worship set'}
VIEWS.home=()=>{
  PLAN=todayPlan();const ns=nextSet(),nm=S.profile.name?', '+esc(S.profile.name):'',goal=S.profile.goalDays||4;
  return`<h1>Hello${nm}</h1><p class="mu">Short, patient practice beats long, forced practice.</p>
  <div class="row mt"><div class="stat"><b>${streakDays()}</b><span class="sm mu">day streak</span></div><div class="stat"><b>${weekDays()}/${goal}</b><span class="sm mu">days this week</span></div><div class="stat"><b>${S.profile.level}</b><span class="sm mu">level</span></div></div>
  ${S.profile.lo==null?`<div class="card click" data-act="go" data-v="assess"><h3>Find your range →</h3><p class="mu sm">A 3-minute check so every exercise and song fits your voice. Highly recommended first step.</p></div>`:`<div class="card"><p class="sm mu">Your comfortable range</p><b>${midiName(S.profile.lo)} – ${midiName(S.profile.hi)}</b> <span class="badge">${voiceHint(S.profile.lo,S.profile.hi)} range</span></div>`}
  <h2>Today’s plan</h2>
  ${PLAN.map((st,i)=>`<div class="card row sp"><div><h3>${esc(planTitle(st))}</h3><p class="mu sm">${esc(st.why)}</p></div><button class="btn pri sm" data-act="planGo" data-i="${i}">Start</button></div>`).join('')}
  ${ns?`<h2>Next service</h2><div class="card click" data-act="go" data-v="set" data-id="${ns.id}"><h3>${esc(ns.name)}</h3><p class="mu sm">${fmtDate(ns.date)} · ${daysUntil(ns.date)===0?'today':daysUntil(ns.date)+' day(s) to go'} · ${ns.items.length} song(s)</p></div>`:''}
  <p class="tc mt"><button class="btn sm" data-act="go" data-v="settings">Settings & backup</button></p>`;
};
function runStep(st){
  if(st.act==='exercise')go('exercise',{id:st.id});
  else if(st.act==='song'){initP(st.id,{transpose:st.transpose,sing:st.sing,from:st.from==null?undefined:st.from,to:st.to==null?undefined:st.to,loop:!!st.loop});go('practice')}
  else if(st.act==='setrun')go('setrun',{id:st.id,from:st.from,to:st.to});
}
A.planGo=d=>runStep(PLAN[+d.i]);
A.go=d=>{if(d.v==='song'){go('song',{id:d.id})}else if(d.v==='set'){go('set',{id:d.id})}else go(d.v,d.id?{id:d.id}:{})};
A.back=()=>{stopRun(true);Mic.stop();V=STACK.pop()||{name:'home',p:{}};LASTRES=null;VIEWSPEC=null;render();window.scrollTo(0,0)};
A.tab=d=>{STACK=[];go(d.t,{},true)};

/* --- TRAIN --- */
VIEWS.train=()=>`<h1>Train</h1><p class="mu">Each exercise explains why it helps, plays the note for you, then listens.</p>
 <div class="card click" data-act="go" data-v="assess"><h3>${S.profile.lo==null?'Find your range':'Re-check your range'}</h3><p class="mu sm">${S.profile.lo==null?'Start here — 3 minutes':'Your range: '+midiName(S.profile.lo)+' – '+midiName(S.profile.hi)}</p></div>
 ${EXS.map(e=>{const last=[...S.sessions].reverse().find(s=>s.ref===e.id);return`<div class="card click" data-act="go" data-v="exercise" data-id="${e.id}"><div class="row sp"><h3>${e.icon} ${e.name}</h3>${levelBadge(e.id)}</div><p class="mu sm">${e.why}</p>${last?`<p class="sm">Last: ${last.acc}% in tune</p>`:''}</div>`}).join('')}`;

/* --- ASSESSMENT --- */
VIEWS.assess=()=>{
  const st=AS.step;
  if(st===0)return`${hdr('Find your range')}<div class="card"><p>I will listen to your lowest and highest comfortable notes, then check your pitch accuracy. It takes about 3 minutes.</p><ul class="sm mu"><li>Find a quiet spot and use headphones if you can.</li><li>Sing a relaxed “ah”. Never push — comfortable notes only.</li><li>Your voice stays on your device.</li></ul></div><button class="btn pri big" data-act="asNext">Begin</button>`;
  if(st===1||st===2){
    const low=st===1;
    return`${hdr('Step '+st+' of 3')}<div class="card"><h3>${low?'Your lowest comfortable note':'Your highest comfortable note'}</h3><p class="mu">${low?'Slide down on a gentle “ah” until it feels like the lowest note you can sing easily. Then hold that note steady for two seconds.':'Slide up on a light “ooh” until it feels like the highest note you can sing easily — no straining. Hold it steady for two seconds.'}</p>
    <div class="now"><div class="nn" id="capn">–</div><div class="grow"></div></div><p class="mu sm" id="capm">${AS.locked?'':'Press the button, then sing.'}</p></div>
    ${AS.locked?`<div class="card tc"><b style="font-size:1.6rem">${midiName(AS.locked)}</b><p class="mu sm">Got it.</p></div><div class="row"><button class="btn" data-act="capRetry" style="flex:1">Try again</button><button class="btn pri" data-act="asNext" style="flex:1">Next</button></div>`:`<button class="btn pri big" data-act="capStart">Start listening</button>`}`;
  }
  if(st===3){
    const{lo,hi}=AS,R=rng(Date.now()&0xffffff),ev=[],cues=[];let t=0;
    for(let i=0;i<6;i++){const m=lo+2+Math.floor(R()*Math.max(1,hi-lo-3));cues.push({t,text:'Listen …'});ev.push({t,d:1,midi:m,voice:'guide',scored:false,audible:true});t+=1.4;cues.push({t,text:'Sing it back'});ev.push({t,d:1.2,midi:m,voice:'you',scored:true,audible:false});t+=2.2}
    VIEWSPEC={title:'Range & accuracy check',kind:'assessment',ref:'assessment',events:ev,cues,chords:[],clicks:[],lineMarks:null,dur:t,beatSec:0.6,countIn:0,tol:40,level:1,onDone:s=>{AS.acc=s.accuracy;AS.step=4;const lv=s.accuracy<45?1:s.accuracy<60?2:s.accuracy<75?3:4;S.profile.level=lv;S.profile.assessedAt=Date.now();S.profile.lv={};save()}};
    return`${hdr('Step 3 of 3')}<p class="mu">Six short notes inside your range. Listen, then sing each one back.</p>${rollBlock()}${runBtn('Start')}`;
  }
  const lv=S.profile.level;
  return`<h1>Your starting point</h1><div class="card"><p class="sm mu">Comfortable range</p><b style="font-size:1.4rem">${midiName(S.profile.lo)} – ${midiName(S.profile.hi)}</b><p class="sm mu">That is about ${((S.profile.hi-S.profile.lo)/12).toFixed(1)} octaves, which sits in the <b>${voiceHint(S.profile.lo,S.profile.hi)}</b> region. This is a hint, not a label — your range grows with practice.</p></div>
  <div class="card"><p class="sm mu">Pitch accuracy</p><b style="font-size:1.4rem">${AS.acc}%</b> <span class="badge">Start at level ${lv}</span><p class="sm mu">Exercises will adjust automatically as you improve — three strong sessions move you up; a tough patch eases you down.</p></div>${resultCard()}
  <button class="btn pri big" data-act="asDone">Go to training</button>`;
};
AFTER.assess=()=>{if(AS.step===3)drawRoll(0)};
A.asNext=()=>{
  if(AS.step===0){AS={step:1}}
  else if(AS.step===1){AS.low=AS.locked;AS.locked=null;AS.step=2}
  else if(AS.step===2){
    if(AS.locked<=AS.low+6){toast('Try a higher note — at least a fifth above your low note.');AS.locked=null;render();return}
    AS.lo=AS.low;AS.hi=AS.locked;AS.locked=null;S.profile.lo=AS.lo;S.profile.hi=AS.hi;save();AS.step=3;
  }
  Mic.subs.clear();render();window.scrollTo(0,0);
};

A.capStart=async()=>{
  if(!(await Mic.start())){toast('Microphone access is needed. Allow it in your browser settings.');return}
  const h=[];let gap=0,t0=Date.now();$('#capm').textContent='Listening … sing now.';
  const sub=f=>{
    const n=$('#capn');
    if(f.midi==null){gap++;if(gap>6)h.length=0;if(n)n.textContent='–';
      if(Date.now()-t0>25000){Mic.subs.delete(sub);const m=$('#capm');if(m)m.textContent='I could not hear a steady note. Try singing a little closer to the mic, then press Start again.';const b=document.querySelector('[data-act=capStart]');}return}
    gap=0;h.push(f.midi);if(n)n.textContent=midiName(f.midi);
    const need=Math.round(1.4*FPS);
    if(h.length>=need){const w=h.slice(-need);if(Math.max(...w)-Math.min(...w)<0.7){Mic.subs.delete(sub);AS.locked=Math.round(median(w));render()}}
  };
  Mic.subs.add(sub);
};

function songToText(s){return s.lines.map(l=>[l.lyric||'',l.v1,l.v2||'',l.v3||''].join(' | ').replace(/( \| )+$/,'')).join('\n')}
function textToLines(txt){
  const lines=[],errs=[];
  txt.split('\n').map(x=>x.trim()).filter(Boolean).forEach((row,i)=>{
    const c=row.split('|').map(x=>x.trim());
    if(c.length<2||!c[1]){errs.push('Line '+(i+1)+': add the melody after a | divider');return}
    try{c.slice(1,4).forEach(n=>parseNotation(n))}catch(e){errs.push('Line '+(i+1)+': '+e.message);return}
    lines.push({lyric:c[0],v1:c[1],v2:c[2]||'',v3:c[3]||''});
  });
  if(!lines.length&&!errs.length)errs.push('Add at least one line');
  return{lines,errs};
}

  return`<h1>Progress</h1>
  <div class="row mt"><div class="stat"><b>${ss.length}</b><span class="sm mu">sessions</span></div><div class="stat"><b>${a==null?'\u2013':a+'%'}</b><span class="sm mu">recent accuracy</span></div><div class="stat"><b>${streakDays()}</b><span class="sm mu">day streak</span></div></div>
  ${a!=null&&b!=null?`<p class="sm ${a>=b?'':'mu'}">${a>b?'Up '+(a-b)+' points on the week before \u2014 well done.':a===b?'Steady compared with last week.':'Slightly lower than last week \u2014 that is normal. Consistency matters most.'}</p>`:''}
  <h2>Pitch accuracy over time</h2><div class="card"><canvas id="chart" style="width:100%;height:170px;display:block"></canvas>${ss.length<2?'<p class="mu sm tc">Complete a couple of sessions to see your trend.</p>':''}</div>
  <h2>Personal bests</h2>${Object.values(best).sort((x,y)=>y.acc-x.acc).slice(0,6).map(s=>`<div class="row sp sm"><span>${esc(s.title)}</span><b>${s.acc}%</b></div>`).join('')||'<p class="mu sm">Nothing yet.</p>'}
  <h2>Recent sessions</h2>${[...ss].reverse().slice(0,8).map(s=>`<div class="row sp sm"><span>${new Date(s.t).toLocaleDateString()} \u00b7 ${esc(s.title)}</span><b>${s.acc}%</b></div>`).join('')||'<p class="mu sm">Nothing yet.</p>'}
  <h2>My recordings</h2><p class="mu sm">Stored only on this device. Pick one as A and another as B to compare.</p>
  ${recs.length?recs.map(r=>`<div class="card"><div class="row sp"><div><b class="sm">${esc(r.title)}</b><p class="mu sm">${new Date(r.t).toLocaleString()} \u00b7 ${r.acc}% in tune</p></div></div><div class="row g8 mt wrap"><button class="btn sm" data-act="recA" data-id="${r.id}">A</button><button class="btn sm" data-act="recB" data-id="${r.id}">B</button><button class="btn sm dn" data-act="recDel" data-id="${r.id}">Delete</button></div></div>`).join(''):'<p class="mu sm">Turn on \u201cRecord my voice\u201d in song practice to keep takes.</p>'}
  ${PR.a||PR.b?`<h2>Compare</h2>${slot('a')}${slot('b')}`:''}`;
};
AFTER.progress=()=>{
  const cv=$('#chart');if(cv){
    const d=fitCanvas(cv),c=cv.getContext('2d'),W=cv.clientWidth,H=cv.clientHeight;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,W,H);
    c.font='10px system-ui';c.fillStyle='#93a0b8';c.strokeStyle='rgba(147,160,184,.2)';
    [0,50,100].forEach(v=>{const y=H-16-(H-26)*v/100;c.beginPath();c.moveTo(24,y);c.lineTo(W,y);c.stroke();c.fillText(v,2,y+3)});
    const pts=S.sessions.slice(-30);
    if(pts.length){const X=i=>24+(W-34)*(pts.length===1?.5:i/(pts.length-1)),Y=v=>H-16-(H-26)*v/100;
      c.strokeStyle='#f2b84b';c.lineWidth=2;c.beginPath();pts.forEach((s,i)=>i?c.lineTo(X(i),Y(s.acc)):c.moveTo(X(i),Y(s.acc)));c.stroke();c.lineWidth=1;
      pts.forEach((s,i)=>{c.fillStyle=s.acc>=70?'#34c38f':s.acc>=50?'#f5b73d':'#f0795a';c.beginPath();c.arc(X(i),Y(s.acc),3.5,0,7);c.fill()})}
  }
  document.querySelectorAll('audio[data-rec]').forEach(async a=>{const u=await getUrl(a.dataset.rec);if(u)a.src=u});
};
A.recA=d=>{PR.a=d.id;render(true)};A.recB=d=>{PR.b=d.id;render(true)};
A.recDel=async d=>{if(!confirm('Delete this recording?'))return;await IDB.del(d.id).catch(()=>{});S.recs=S.recs.filter(r=>r.id!==d.id);if(PR.a===d.id)PR.a=null;if(PR.b===d.id)PR.b=null;save();render(true)};

/* --- SETTINGS --- */
let DEFERRED=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e});
VIEWS.settings=()=>`${hdr('Settings')}
 <label>Your name</label><input data-in="name" value="${esc(S.profile.name)}">
 <label>Practice days per week (goal)</label><select data-chg="goal">${[1,2,3,4,5,6,7].map(n=>`<option ${S.profile.goalDays==n?'selected':''}>${n}</option>`).join('')}</select>
 <label>Usual part</label><select data-chg="part">${['v1','v2','v3'].map(v=>`<option value="${v}" ${S.profile.part===v?'selected':''}>${PARTN[v]}</option>`).join('')}</select>
 <label><input type="checkbox" data-chg="phones" ${S.settings.headphones?'checked':''}> I use headphones (best pitch detection). Untick when using the speaker.</label>
 <h2>Your data</h2><p class="mu sm">Everything \u2014 including recordings \u2014 stays on this device. Nothing is uploaded.</p>
 <div class="row wrap g8"><button class="btn sm" data-act="export">Export backup</button><button class="btn sm" data-act="importPick">Import backup</button><button class="btn sm dn" data-act="wipe">Delete all my data</button></div>
 <input type="file" id="imp" accept="application/json" style="display:none">
 ${DEFERRED?'<div class="mt"><button class="btn pri sm" data-act="install">Install app</button></div>':'<p class="mu sm mt">To install: open the browser menu and choose \u201cAdd to Home screen\u201d.</p>'}
 <h2>About</h2><p class="mu sm">A patient vocal coach for worship. It never asks you to force a note \u2014 comfortable singing first.</p>`;
IN.name=v=>{S.profile.name=v;save()};
CHG.goal=v=>{S.profile.goalDays=+v;save()};CHG.part=v=>{S.profile.part=v;save()};
CHG.phones=(v,el)=>{S.settings.headphones=el.checked;save();Mic.stop()};
A.install=async()=>{if(DEFERRED){DEFERRED.prompt();DEFERRED=null}};
A.export=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vocal-coach-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup saved (recordings are not included)')};
A.importPick=()=>$('#imp').click();
A.wipe=async()=>{if(!confirm('Delete ALL your data and recordings from this device? This cannot be undone.'))return;localStorage.removeItem(LS);await IDB.clear().catch(()=>{});S=loadState();STACK=[];PR={a:null,b:null};go('home',{},true);toast('All data deleted')};

/* --- wiring --- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.in&&IN[el.dataset.in])IN[el.dataset.in](el.value,el)});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='imp'){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const r=JSON.parse(t);if(!r.profile||!Array.isArray(r.sessions))throw 0;if(!confirm('Replace current data with this backup?'))return;localStorage.setItem(LS,JSON.stringify({...r,recs:[]}));S=loadState();STACK=[];go('home',{},true);toast('Backup restored')}catch(x){toast('That file is not a valid backup')}});return}
  if(el.dataset&&el.dataset.chg&&CHG[el.dataset.chg])CHG[el.dataset.chg](el.value,el);
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();

</script></body></html>
